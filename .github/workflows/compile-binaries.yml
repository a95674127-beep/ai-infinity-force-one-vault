name: Compile Binaries

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  build-matrix:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install libyara (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libyara-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Resolve binary path for this platform
        id: bin
        shell: bash
        run: |
          BIN="ai-infinity-force-one"
          if [[ "${{ matrix.platform.os }}" == "windows-latest" ]]; then
            BIN="${BIN}.exe"
          fi
          echo "Resolved binary name: $BIN"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-infinity-${{ matrix.platform.name }}
          path: target/${{ matrix.platform.target }}/release/${{ steps.bin.outputs.bin }}
          
