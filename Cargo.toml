[package]
name = "ai-infinity-force-one"
version = "0.1.0"
edition = "2021"
description = "Zero-trust vault core: Argon2id + XChaCha20-Poly1305 envelope encryption, deny-by-default access policy, and a hash-chained tamper-evident audit log."
license = "MIT"
repository = "https://github.com/YOUR-USERNAME/ai-infinity-force-one-vault"

[lib]
name = "ai_infinity_force_one"
path = "src/lib.rs"

[[bin]]
name = "vault-cli"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[profile.release]
overflow-checks = true
